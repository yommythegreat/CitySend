<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="CitySend — same-day delivery across Winnipeg. Send anything that fits in a car." />

    <!-- iOS home-screen web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CitySend" />

    <!-- Android / PWA -->
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CitySend — Same-day delivery</title>
    <!-- Fonts are self-hosted (bundled via @fontsource in main.tsx). -->
    <!-- Warm up connections to the backends we're about to hit, so the first
         Supabase query and the checkout don't pay DNS + TLS setup cost. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="https://js.stripe.com" />
    <link rel="preconnect" href="https://api.stripe.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
