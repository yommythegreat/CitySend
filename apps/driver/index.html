<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title>CitySend Driver</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#0b1220">
        Loading CitySend Driver...
      </div>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        document.getElementById('root').innerHTML = '<pre style="padding:24px;white-space:pre-wrap;font-family:ui-monospace,monospace;color:#b3261e">Startup error: ' + event.message + '</pre>';
      });
      window.addEventListener('unhandledrejection', function (event) {
        document.getElementById('root').innerHTML = '<pre style="padding:24px;white-space:pre-wrap;font-family:ui-monospace,monospace;color:#b3261e">Startup error: ' + event.reason + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
